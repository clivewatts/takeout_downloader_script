services:
  takeout-downloader:
    build: .
    container_name: takeout-downloader
    restart: unless-stopped
    ports:
      # Host port 5001 by default: macOS uses 5000 for AirPlay Receiver.
      # Override with WEB_PORT=5000 docker compose up -d
      - "127.0.0.1:${WEB_PORT:-5001}:5000"
    volumes:
      # Host directory for downloaded archives (created automatically).
      # Override with DOWNLOADS_DIR=/path/to/downloads
      - "${DOWNLOADS_DIR:-./downloads}:/downloads"
    environment:
      - OUTPUT_DIR=/downloads
      - PARALLEL_DOWNLOADS=2
      - FILE_COUNT=100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
